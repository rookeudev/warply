[package]
name = "warply"
version = "0.4.0"
description = "Windows desktop client for Cloudflare WARP via WireGuard"
authors = ["Warply contributors"]
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "warply_lib"
crate-type = ["rlib"]

[[bin]]
name = "warply"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "=2.13.1"
updater-http = { package = "reqwest", version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
base64 = "0.22"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
